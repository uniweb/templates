# Tenured Biology — saved view.
#
# Selects biology-department members who hold tenure. The `where:`
# value is a where-object (structured JSON predicate) — the language a
# query's own `where:` is written in.
#
# When this view is picked, the foundation's useFilteredMembers hook runs
# the framework's evaluator (matchWhere, from @uniweb/core) over the
# members the report page's query delivered. Wherever those records come
# from, this file is unchanged.

name: Tenured Biology
description: Tenured members of the Department of Biology.
source: members
where:
  department: biology
  tenured: true
