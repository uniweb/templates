# Theme — "Institute" (academic-metrics default)
#
# A clean, institutional palette: near-white page, deep slate body,
# Inter heading + body for a legible, spreadsheet-adjacent feel.
# The xlsx adapter will later read these font tokens at compile time
# so the Excel file inherits the preview's typography.

# ─── Colors ────────────────────────────────────────────────────────────────
colors:
  primary: '#1e40af'     # Institutional blue — primary actions, links
  secondary: '#475569'   # Slate — secondary surfaces, table borders
  accent: '#be123c'      # Rose — totals rows, emphasis
  neutral: slate

# ─── Page background ────────────────────────────────────────────────────────
background: '#fafbfc'

# ─── Fonts ──────────────────────────────────────────────────────────────────
fonts:
  heading: "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  body: "'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
  import:
    - url: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap
    - url: https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap

# ─── Context overrides ──────────────────────────────────────────────────────
contexts:
  light:
    section: '#fafbfc'
    card: '#ffffff'
    heading: '#0f172a'
    body: '#334155'
    subtle: '#64748b'
    border: '#e2e8f0'
  medium:
    section: '#f1f5f9'
    card: '#ffffff'
    heading: '#0f172a'
    body: '#334155'
    subtle: '#64748b'
    border: '#cbd5e1'
  dark:
    section: '#0f172a'
    card: '#1e293b'
    heading: '#f8fafc'
    body: '#e2e8f0'
    subtle: '#94a3b8'
    border: '#334155'
