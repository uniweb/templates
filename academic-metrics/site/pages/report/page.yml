title: Academic Metrics
description: An aggregate report across the selected set of members. Same data feeds the web preview and the downloadable Excel workbook.

# Both queries reach every section on this page (the foundation's main.js
# declares both keys for every section):
#   - members  → every member; the Loom-rendered Cover narrative reads totals from it.
#   - queries  → the saved views; a section looks up the selected view's `where:` here.
# Sections that show the FILTERED member set call useFilteredMembers(), a
# foundation hook that composes the active predicate from page.state and
# keeps the members it matches — in the browser, without another request.
query: [members, queries]
