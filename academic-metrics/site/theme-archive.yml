# Theme — "Archive" (academic-metrics alternate variant)
#
# A warm editorial palette for units that lean library / humanities /
# historical rather than clinical. Deep teal as the institutional hue,
# amber as the emphasis. Merriweather serif for headings gives the
# report a printed-journal feel; Source Sans Pro keeps the body
# readable at long tables.
#
# Drop-in replacement for theme.yml — the foundation uses the same
# semantic tokens, so no component code changes. Swap:
#
#   cd site
#   mv theme.yml theme-institute.yml
#   mv theme-archive.yml theme.yml

# ─── Colors ────────────────────────────────────────────────────────────────
colors:
  primary: '#115e59'     # Deep teal — academic but warm
  secondary: '#57534e'   # Warm stone — dividers, secondary surfaces
  accent: '#b45309'      # Amber — totals rows, emphasis, hover states
  neutral: stone

# ─── Page background ────────────────────────────────────────────────────────
background: '#fbf8f1'    # Soft cream — printed-paper feel

# ─── Fonts ──────────────────────────────────────────────────────────────────
fonts:
  heading: "'Merriweather', 'Times New Roman', Georgia, serif"
  body: "'Source Sans Pro', ui-sans-serif, system-ui, sans-serif"
  mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
  import:
    - url: https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap
    - url: https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&display=swap
    - url: https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap

# ─── Context overrides ──────────────────────────────────────────────────────
contexts:
  light:
    section: '#fbf8f1'
    card: '#ffffff'
    heading: '#292524'
    body: '#44403c'
    subtle: '#78716c'
    border: '#e7e5e4'
    muted: '#f5f5f4'
  medium:
    section: '#f5f0e4'
    card: '#fbf8f1'
    heading: '#292524'
    body: '#44403c'
    subtle: '#78716c'
    border: '#d6d3d1'
    muted: '#e7e5e4'
  dark:
    section: '#292524'
    card: '#3f3a36'
    heading: '#fbf8f1'
    body: '#e7e5e4'
    subtle: '#a8a29e'
    border: '#44403c'
    muted: '#3f3a36'

# ─── Inline styles ──────────────────────────────────────────────────────────
inline:
  accent:
    color: 'var(--accent)'
    font-weight: '600'
  subtle:
    color: 'var(--subtle)'
    font-style: italic
