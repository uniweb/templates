# Sample monograph data — Darwin's Galapagos observations.
#
# The collection processor loads each .yml in this folder as one item
# with `slug` (from the filename) plus every top-level key below. So
# `content.data.monograph[0]` in a section component resolves to the
# beagle item with title, author, specimens, etc. directly on it.

title: Observations on the Zoology of the Galapagos Archipelago
author: Charles Darwin
affiliation: H.M.S. Beagle · Second Surveying Voyage
date: 'October 1835'
abstract: |
  Between the 15th of September and the 20th of October 1835,
  H.M.S. Beagle visited the Galapagos Archipelago, where observations
  were made on the geology, climate, and natural history of the islands.
  The present account summarises the zoological specimens collected
  and the geological features surveyed, with particular attention to
  the remarkable endemism of the terrestrial fauna — most notably
  the giant tortoises and the small land-birds of the finch-family,
  whose variation by island appears to be more than accidental.

# Tortoises collected on each island. The SpecimenTable section
# renders this as a bordered 4-column table (island, species, count,
# notes) in both the web preview and the compiled docx.
specimens:
  - island: Española
    species: Chelonoidis hoodensis
    count: 3
    notes: 'Saddleback carapace; long upraised neck.'
  - island: Isabela
    species: Chelonoidis guntheri
    count: 2
    notes: 'Domed form; collected on the slopes of Volcán Wolf.'
  - island: Santa Cruz
    species: Chelonoidis porteri
    count: 4
    notes: 'Intermediate carapace; the most numerous form seen.'
  - island: San Cristóbal
    species: Chelonoidis chathamensis
    count: 2
    notes: 'Modified saddleback; a larger body than the Española form.'
  - island: Pinzón
    species: Chelonoidis duncanensis
    count: 1
    notes: 'Small population; juvenile.'

# Finch beak measurements. The FinchMeasurements section renders
# this as a numeric table. Values are illustrative rather than
# verbatim from the historical specimens.
