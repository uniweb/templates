  - species: Geospiza magnirostris
    island: Floreana
    beakDepth: 19.4
    beakLength: 16.2
    count: 5
  - species: Geospiza fortis
    island: Santa Cruz
    beakDepth: 12.1
    beakLength: 11.4
    count: 8
  - species: Geospiza fuliginosa
    island: Isabela
