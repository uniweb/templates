# A whole CV as a structured data file. The collection processor
# picks up every .yml / .yaml / .json file in the collection folder
# and emits it as one item with `slug` (from filename) + all the
# fields below. The Career Summary page's foundation content handler
# flattens this into the Loom variable namespace, so every
# `{expression}` in the page markdown reads from the fields you see
# here.
#
# Conventions worth knowing:
#
#   - Year fields are quoted strings. Loom's default formatter
#     applies locale grouping to numeric results (turning 1859 into
#     "1,859"), which reads wrong for years. Quote them and Loom
#     leaves them alone. Numeric comparisons (`year > '1870'`) still
#     work — Loom coerces.
#
#   - Amount fields are plain numbers so totals and averages get the
#     locale separator you want for currency ("1,530").
#
#   - `funding` is pre-sorted largest → smallest so `funding.0`
#     gives you the top grant directly. Plain-form `SORTED BY field`
#     is reliable only for homogeneous lists of primitives; pre-sort
#     the source data when you need the top item by a different key.

