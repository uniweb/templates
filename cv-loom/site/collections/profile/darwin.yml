# Charles Darwin — CV profile data
#
# A whole CV as a single structured data file. The collection processor
# picks up every .yml file in the collection folder and emits it as one
# item with `slug` (from filename) + all the fields below. The content
# handler in foundation.js flattens data.profile[0] into the Loom
# variable namespace, so every {expression} in the section markdown
# reads directly from these fields.
#
# Conventions:
#
#   - Year fields are plain numbers. Loom skips locale grouping for
#     4-digit integers, so 1859 renders as "1859" not "1,859".
#     Comparisons like WHERE year > 1870 work naturally.
#
#   - Money amounts are plain numbers so TOTAL OF / AVERAGE OF get
#     locale-grouped output ("1,530").
#
#   - Lists are ordered by relevance or reverse chronology. SORTED BY
#     sorts by the named field when items are objects. Pre-sort source
#     data when alphabetical field order doesn't match display order.

# ─── Personal ───────────────────────────────────────────────────────
first_name: Charles
family_name: Darwin
title: Fellow of the Royal Society
role: Naturalist and Independent Researcher
affiliation: Down House, Downe, Kent, England
email: c.darwin@royalsociety.org
website: https://darwin-online.org.uk
orcid: '0000-0001-8200-1882'
career_start: 1831
career_end: 1882

# ─── Research areas ─────────────────────────────────────────────────
research_areas:
  - Natural selection and the origin of species
  - Biogeography and coral reef formation
  - Systematics of the Cirripedia (barnacles)
  - Botany — climbing plants, insectivorous plants, orchid pollination
  - Expression of emotions in animals and humans
  - Earthworm ecology and soil formation

