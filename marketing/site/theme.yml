colors:
  primary: "#3b82f6"
  secondary: "#64748b"
  neutral: slate

contexts:
  light:
    section: white
    subtle: neutral-500
    border: neutral-200
  medium:
    section: neutral-100
    subtle: neutral-600
    border: neutral-300
  dark:
    section: neutral-900
    subtle: neutral-400
    border: neutral-700

inline:
  accent:
    color: var(--link)
    font-weight: "600"

appearance:
  default: light
  schemes: [light]
  allowToggle: false
  respectSystemPreference: false
