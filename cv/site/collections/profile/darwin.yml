# Charles Darwin — CV profile data
#
# A complete CV as a single structured data file. Section components
# read their data field from this profile (education, publications,
# funding, etc.) and render it directly — no Loom, no content handler.
#
# Publications use CSL-JSON fields for citestyle integration.
# Years are quoted strings to prevent locale grouping (1859 → "1,859").

# ─── Personal ───────────────────────────────────────────────────────
first_name: Charles
family_name: Darwin
role: Naturalist and Independent Researcher
affiliation: Down House, Downe, Kent
email: c.darwin@royalsociety.org
website: https://darwin-online.org.uk
orcid: '0000-0001-8200-1882'
born: '1809-02-12'

biography: >
  Charles Robert Darwin was an English naturalist, geologist, and
  biologist, widely known for his contributions to evolutionary biology.
  His proposition that all species of life have descended from a common
  ancestor is now widely accepted and considered a foundational concept
  in science.

# ─── Education ──────────────────────────────────────────────────────
education:
  - degree: BA (Honours)
    institution: Christ's College, University of Cambridge
    field: Theology and Natural Science
    start: '1828'
    end: '1831'
    description: >
      Studied with John Stevens Henslow, who encouraged his interest
      in natural history and recommended him for the Beagle voyage.
  - degree: Medical studies (incomplete)
    institution: University of Edinburgh
    field: Medicine
    start: '1825'
    end: '1827'
    description: >
      Left medical school after two years, having found surgery
      distressing and lectures dull.

# ─── Employment ─────────────────────────────────────────────────────
employment:
  - role: Independent Researcher
    organization: Down House
    location: Downe, Kent
    start: '1842'
    end: '1882'
    description: >
      Conducted research on barnacles, orchids, earthworms, plant
      movement, and the theory of evolution.
  - role: Ship's Naturalist
    organization: HMS Beagle, Royal Navy
    location: Worldwide expedition
    start: '1831'
    end: '1836'
    description: >
      Five-year circumnavigation collecting geological, zoological,
      and botanical specimens across South America, the Galápagos,
      and the Pacific.

