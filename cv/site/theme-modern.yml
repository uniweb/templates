# Theme Configuration — "Modern" (alternate)
#
# A visibly different variant to demonstrate that one
# faculty-annual-report foundation can serve multiple tenants
# through theme alone. Same foundation code, same sections,
# same Press pipeline — swap only this file to get a completely
# different docusite appearance.
#
# This variant uses Inter for everything (a widely-shipped
# neutral sans-serif), a fresh emerald primary, cool zinc
# neutral, and pure white sections. Contemporary, clean,
# airy. Suited to departments that want a modern corporate
# look rather than a period-document feel.
#
# To activate: copy the contents of this file into theme.yml
# (or rename files so this becomes theme.yml). See THEMES.md
# for the full walkthrough.

# ─── Colors ────────────────────────────────────────────────────────────────────
colors:
  primary: '#059669'     # Emerald-600 — fresh, contemporary
  secondary: '#64748b'   # Slate-500 — muted grounding
  accent: '#d97706'      # Amber-600 — decorative contrast
  neutral: zinc          # Cool gray family

# ─── Page background ──────────────────────────────────────────────────────────
background: '#ffffff'    # Pure white

# ─── Fonts ─────────────────────────────────────────────────────────────────────
# Inter for both headings and body (common SaaS choice — the
# same typography stack used by Stripe, Linear, Vercel, and
# half of academic-adjacent startups). JetBrains Mono for code.
fonts:
  heading: "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
  body: "'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
  mono: "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace"
  import:
    - url: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap
    - url: https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap

# ─── Context overrides ─────────────────────────────────────────────────────────
contexts:
  light:
    section: '#ffffff'     # pure white
    card: '#fafafa'        # cards tint very slightly
    heading: '#0a0a0a'     # near-black
    body: '#18181b'        # zinc-900
    subtle: '#71717a'      # zinc-500
    border: '#e4e4e7'      # zinc-200
  medium:
    section: '#fafafa'     # zinc-50
    card: '#ffffff'
    heading: '#0a0a0a'
    body: '#18181b'
    subtle: '#71717a'
    border: '#d4d4d8'
  dark:
    section: '#18181b'     # zinc-900
    card: '#27272a'        # zinc-800
    heading: '#fafafa'     # zinc-50
    body: '#e4e4e7'        # zinc-200
    subtle: '#a1a1aa'      # zinc-400
    border: '#3f3f46'      # zinc-700

# ─── Inline styles ─────────────────────────────────────────────────────────────
inline:
  accent:
    color: 'var(--primary)'
    font-weight: '600'
  muted:
    color: 'var(--subtle)'
    font-style: italic
