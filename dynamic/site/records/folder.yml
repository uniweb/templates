# How this site's records are organized. Every other file in records/ is a record
# already and sits at the top of the site's folder — this only places some in
# sub-folders. It is the one file here that is not a record.
#
# Logbook entries, organized by the kind of work. A folder is what a query reads with
# `scope:` (`scope: field`); it is not part of an entry's URL, which is its name:
# /logbook/welcome, /logbook/river-survey, /logbook/dna-results.
- folder: field
  label: Field work
  records:
    - logbook/river-survey.md
    - logbook/night-count.md
- folder: lab
  label: Lab work
  records:
    - logbook/dna-results.md
