colors:
  primary:
    base: "#059669"
    exactMatch: true
  secondary: "#475569"
  accent: "#d97706"
  neutral: "#475569"

contexts:
  light:
    primary: primary-500
    primary-hover: primary-600

fonts:
  import:
    - url: "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  heading: "Inter, system-ui, sans-serif"
  body: "Inter, system-ui, sans-serif"

inline:
  # A full redefinition: [text]{accent} is a code chip here, not emphasis.
  # `font-weight: inherit` opts out of the default bold — inline styles merge
  # property by property, so a default you don't want needs a neutral value.
  accent:
    color: var(--primary-600)
    background: var(--primary-50)
    font-family: var(--font-code)
    font-weight: inherit
    padding: 0.125rem 0.375rem
    border-radius: 0.25rem
