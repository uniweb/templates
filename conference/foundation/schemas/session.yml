# A talk in the programme. Referenced as '@/session'.
name: session
label: Session
description: A talk, workshop or panel in the conference programme.

# Who may add a session is the site's blueprint.yml: a type it does not open is the
# organiser's alone to add. What keeps a session the organiser's once written is the
# entry — only its owner may edit it.

fields:
  title:    { type: string, required: true }
  abstract: { type: markdown }
  speaker:  { type: string }
  room:     { type: string }
  minutes:  { type: number }
