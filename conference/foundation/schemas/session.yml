# A talk in the programme. Referenced as '@/session'.
name: session
label: Session
description: A talk, workshop or panel in the conference programme.

# Models are open: anyone signed in may create a session of their own. What keeps the
# programme the organiser's is the entry — only its owner may edit it.

fields:
  title:    { type: string, required: true }
  abstract: { type: markdown }
  speaker:  { type: string }
  room:     { type: string }
  minutes:  { type: number }
